<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="ledgerLines" width="1200" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="28" x2="1200" y2="28" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0a0e17"/>
  <rect width="1200" height="280" fill="url(#ledgerLines)"/>

  <!-- Left margin rule, ledger-book style -->
  <line x1="90" y1="0" x2="90" y2="280" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="96" y1="0" x2="96" y2="280" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Top-right context tag -->
  <text x="1140" y="40" text-anchor="end" font-family="Courier New, monospace" font-size="13" letter-spacing="2" fill="#8b93a7">RAZORPAY AI BUILDATHON</text>
  <text x="1140" y="60" text-anchor="end" font-family="Courier New, monospace" font-size="13" letter-spacing="2" fill="#f59e0b">OPEN TRACK</text>

  <!-- Simple ledger/book glyph -->
  <g transform="translate(130,95)">
    <rect x="0" y="0" width="70" height="90" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="35" y1="0" x2="35" y2="90" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="10" y1="20" x2="28" y2="20" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="10" y1="35" x2="28" y2="35" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="10" y1="50" x2="28" y2="50" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="42" y1="20" x2="60" y2="20" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="42" y1="35" x2="60" y2="35" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="42" y1="50" x2="60" y2="50" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="240" y="140" font-family="Courier New, monospace" font-size="58" font-weight="bold" letter-spacing="3" fill="#f5f5f0">EVENT <tspan fill="#f59e0b">KHATABOOK</tspan></text>

  <!-- Subtitle -->
  <text x="242" y="175" font-family="Courier New, monospace" font-size="16" letter-spacing="3" fill="#8b93a7">TRUST &amp; AUDIT LAYER FOR STUDENT EVENT PAYMENTS</text>

  <!-- Bottom feature strip -->
  <text x="242" y="225" font-family="Courier New, monospace" font-size="13" letter-spacing="1.5" fill="#5a6275">DUPLICATE DETECTION</text>
  <circle cx="450" cy="221" r="2.5" fill="#f59e0b"/>
  <text x="465" y="225" font-family="Courier New, monospace" font-size="13" letter-spacing="1.5" fill="#5a6275">VOICE VERIFICATION</text>
  <circle cx="660" cy="221" r="2.5" fill="#f59e0b"/>
  <text x="675" y="225" font-family="Courier New, monospace" font-size="13" letter-spacing="1.5" fill="#5a6275">POLICY-DRIVEN REFUNDS</text>
  <circle cx="905" cy="221" r="2.5" fill="#f59e0b"/>
  <text x="920" y="225" font-family="Courier New, monospace" font-size="13" letter-spacing="1.5" fill="#5a6275">FULL AUDIT TRAIL</text>

  <!-- Bottom rule -->
  <line x1="90" y1="255" x2="1140" y2="255" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
</svg>
